<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>학생 관리 Form</title>
        <link rel = "stylesheet" href="index.css">
        <script src="./crud.js" defer></script>
    </head>
    <body>
        <div class = "container">
            <h3 class = "title">학생 관리 Form</h1>

            <fieldset class = "form">
                <form id="studentForm">
                    <input type ="hidden" id="studentId">

                    <label form="name">name:</label>
                    <input type="text" id="name" placeholder="이름을 입력하세요."><br>

                    <label form="age">age:</label>
                    <input type="number" id="age" placeholder="나이를 입력하세요."><br>

                    <label form="major">major:</label>
                    <input type="text" id="major" placeholder="전공을 입력하세요."><br>

                    <label form="grade">grade:</label>
                    <input type="number" id="grade" placeholder="학년을 입력하세요."><br>

                    <button type = "submit" id="addbtn">추가</button>
                    <button type="button" id="cancelBtn" hidden>수정 취소</button>
                </form>
            </fieldset>

            <div class = "box">
                <div class ="search">
                    <input type = "text" id = "searchInput" placeholder="이름이나 전공을 검색하세요.">
                </div>
    
                <h3>학생 목록</h3>
                <ul id="studentList"></ul>
            </div>
        </div>
    </body>
</html>
